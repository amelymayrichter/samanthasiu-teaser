<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Samantha Siu — A New Chapter</title>
  <meta name="description" content="Samantha Siu — new website coming soon.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%}
    body{font-family:Manrope,sans-serif;color:#171717;background:#fff;-webkit-font-smoothing:antialiased}
    .wrap{display:flex;min-height:100vh}
    .text{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:64px 32px 96px;position:relative}
    h1{font-size:0;line-height:0}
    .logo{width:min(390px,80vw);height:auto;display:block}
    .rule{width:64px;height:1px;background:#d6c7b4;margin:40px auto}
    .kicker{font-size:18px;letter-spacing:.2em;text-transform:uppercase}
    .sub{margin-top:24px;font-size:16px;color:#61697a}
    .contact{position:absolute;bottom:32px;left:0;right:0;font-size:15px}
    .contact a{color:#171717;text-decoration:none}
    .contact a:hover{text-decoration:underline}
    .image{flex:1;background:#2a2a2a url("hero.jpg") center/cover no-repeat}
    @media (max-width:800px){
      .wrap{flex-direction:column-reverse}
      .image{min-height:55vh}
      .text{padding:56px 24px 88px}
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="text">
      <h1><img class="logo" src="logo.svg" alt="Samantha Siu"></h1>
      <div class="rule" aria-hidden="true"></div>
      <p class="kicker">A new chapter</p>
      <p class="sub">New website coming soon.</p>
      <p class="contact"><a href="mailto:info@samanthasiu.com">info@samanthasiu.com</a></p>
    </section>
    <section class="image" role="img" aria-label="Hand-carving a lion sculpture in wax"></section>
  </main>
</body>
</html>
